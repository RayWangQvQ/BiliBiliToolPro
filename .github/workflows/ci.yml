name: CI

on:
  pull_request:
    branches: [main]
  # 供 stable.yml 的 changelog job 手动 dispatch：
  # GITHUB_TOKEN 创建的 PR 不会自动触发任何 workflow（GitHub 防递归规则），
  # required checks 只能靠 dispatch 在该分支上补跑。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一个 PR 的新提交取消旧运行
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 构建 + 离线单元测试
  # [Trait("Category", "External")]，被过滤掉，只在本地或按需手动执行。
  Verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          # 不要开 cache：setup-dotnet 的缓存只认 packages.lock.json，
          # 本仓库启用了集中式版本管理（Directory.Packages.props）且没有 lock 文件，
          # 开了会直接 "Dependencies lock file is not found" 报错。

      - name: Format (csharpier)
        run: |
          dotnet tool restore
          if ! dotnet csharpier check .; then
            echo "::error::代码格式不符合 csharpier，上面列出了具体文件。本地执行下面这条再提交："
            echo "::error::    dotnet tool restore && dotnet csharpier format ."
            exit 1
          fi

      - name: Build
        run: dotnet build Ray.BiliBiliTool.sln --configuration Release --nologo

      - name: Test (offline)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          dotnet test Ray.BiliBiliTool.sln --configuration Release --no-build
          --filter "Category!=External" --nologo

  # 发布脚本的 fixture 测试：在临时 git 仓库/模拟 PR 标题上验证算号与 notes 生成。
  # 发布逻辑是发布系统的命脉，但它不碰 .NET 代码，所以独立于 Verify。
  ScriptTests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0：最后的 dry-run 要在真实 tag 历史上演算 alpha 版本
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version derivation fixtures
        run: bash ./scripts/test-version-next.sh

      - name: Release notes fixtures
        run: bash ./scripts/test-release-notes.sh

      - name: Update changelog fixtures
        run: bash ./scripts/test-update-changelog.sh

      # alpha workflow 的版本计算步骤在 PR 上的 dry-run 冒烟（只算不推）
      - name: Alpha version dry-run
        run: |
          planned=$(bash ./scripts/version-next.sh alpha)
          echo "本 PR 合并后将产出 alpha：$planned"

  # 只构建不推送，用来保证合并到 main 之后镜像可以构建
  ImageSmoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: bili-tool-web:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max
