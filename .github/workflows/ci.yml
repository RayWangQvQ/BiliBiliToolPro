name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # 同一个 PR 的新提交取消旧运行
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 版本号一致性 + 构建 + 离线单元测试
  # [Trait("Category", "External")]，被过滤掉，只在本地或按需手动执行。
  Verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # 只为把算出来的版本号播报成 PR 评论
    steps:
      # fetch-depth: 0 是为了拿到全部 tag —— 预览版的 -alpha.N 由已有 tag 推算，
      # 浅克隆看不到 tag，N 就永远算成 1，会和已推过的预览镜像撞号。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          # 不要开 cache：setup-dotnet 的缓存只认 packages.lock.json，
          # 本仓库启用了集中式版本管理（Directory.Packages.props）且没有 lock 文件，
          # 开了会直接 "Dependencies lock file is not found" 报错。

      - name: Format (csharpier)
        run: |
          dotnet tool restore
          if ! dotnet csharpier check .; then
            echo "::error::代码格式不符合 csharpier，上面列出了具体文件。本地执行下面这条再提交："
            echo "::error::    dotnet tool restore && dotnet csharpier format ."
            exit 1
          fi

      - name: Build
        run: dotnet build Ray.BiliBiliTool.sln --configuration Release --nologo

      - name: Test (offline)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          dotnet test Ray.BiliBiliTool.sln --configuration Release --no-build
          --filter "Category!=External" --nologo

      - name: Version matches CHANGELOG
        run: bash ./scripts/version.sh check-consistency

      - name: Report planned version
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: bash ./scripts/report-version.sh post "$BASE_REF"

  # 只构建不推送，用来保证合并到 develop/main 之后镜像可以构建
  ImageSmoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: bili-tool-web:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max
