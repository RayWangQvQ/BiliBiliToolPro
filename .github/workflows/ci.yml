name: CI

on:
  pull_request:
    branches: [main]
    # 这里不能加 paths/paths-ignore：被路径过滤跳过的 workflow 不产生任何检查，
    # required checks 会永远停在 Expected 上锁。文档判定一律放 job 级（见 Scope）。
  # 供 stable.yml 的 changelog job 手动 dispatch。注意 GITHUB_TOKEN 创建的 PR
  # 仍会触发本 workflow，只是运行停在「需要审批」状态，要有写权限的人点
  # Approve 才开跑（GitHub 防递归规则）；而 dispatch 出来的检查不进 PR 的状态
  # 汇总，所以它只是「能手动补跑一次」的后路。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一个 PR 的新提交取消旧运行
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 变更范围判定：本次 PR 是否只碰了文档。纯文档变更跳过下面全部重活
  # （ADR-0011）。判定必须放 job 级：workflow 级 paths 过滤会让 required
  # checks 停在 Pending 阻塞合并，而 job 被 if 跳过会报 Success。
  # 白名单与 alpha.yml 的 paths-ignore 对齐，只少一项 .github/workflows/**：
  # 改 workflow 的 PR 要跑 CI 自检。两处清单改动时要一起改。
  Scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 'true' 表示所有变更文件都命中白名单，重活全部跳过
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      # fetch-depth: 0：要比对 base..head，浅克隆里没有 base commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # fail-open：默认按「有代码变更」处理，只有成功枚举出文件列表、
          # 且每一个都命中白名单，才置 true。git 报错／空 diff 一律跑全量。
          pattern='^(.*\.md|docs/.*|\.editorconfig|bruno/.*)$'
          files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" || true)

          docs_only=false
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$pattern"; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          echo "docs_only=$docs_only，变更文件："
          # 必须整段包在 if 里：空 files 时 `[ -n "$f" ] && echo` 会让循环退出码为 1，
          # 而 run 默认是 bash -e，Scope 会失败 → 下游因 needs 失败被跳过、跳过报
          # Success → 变成静默零校验。Scope 这一步绝不允许失败。
          if [ -n "$files" ]; then
            while IFS= read -r f; do echo "  $f"; done <<< "$files"
          fi

  # 构建 + 离线单元测试
  # [Trait("Category", "External")]，被过滤掉，只在本地或按需手动执行。
  Verify:
    needs: Scope
    if: needs.Scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # 不要开 cache：setup-dotnet 的缓存只认 packages.lock.json，
          # 本仓库启用了集中式版本管理（Directory.Packages.props）且没有 lock 文件，
          # 开了会直接 "Dependencies lock file is not found" 报错。

      - name: Format (csharpier)
        run: |
          dotnet tool restore
          if ! dotnet csharpier check .; then
            echo "::error::代码格式不符合 csharpier，上面列出了具体文件。本地执行下面这条再提交："
            echo "::error::    dotnet tool restore && dotnet csharpier format ."
            exit 1
          fi

      - name: Build
        run: dotnet build Ray.BiliBiliTool.sln --configuration Release --nologo

      - name: Test (offline)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          dotnet test Ray.BiliBiliTool.sln --configuration Release --no-build
          --filter "Category!=External" --nologo

  # 发布脚本的 fixture 测试：在临时 git 仓库/模拟 PR 标题上验证算号与 notes 生成。
  # 发布逻辑是发布系统的命脉，但它不碰 .NET 代码，所以独立于 Verify。
  ScriptTests:
    needs: Scope
    if: needs.Scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0：最后的 dry-run 要在真实 tag 历史上演算 alpha 版本
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version derivation fixtures
        run: bash ./scripts/test-version-next.sh

      - name: Release notes fixtures
        run: bash ./scripts/test-release-notes.sh

      - name: Update changelog fixtures
        run: bash ./scripts/test-update-changelog.sh

      # alpha workflow 的版本计算步骤在 PR 上的 dry-run 冒烟（只算不推）
      - name: Alpha version dry-run
        run: |
          planned=$(bash ./scripts/version-next.sh alpha)
          echo "本 PR 合并后将产出 alpha：$planned"

  # 只构建不推送，用来保证合并到 main 之后镜像可以构建
  ImageSmoke:
    needs: Scope
    if: needs.Scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: bili-tool-web:smoke
          # 不带缓存：交叉编译后冒烟构建只要 2-3 分钟，而 gha 缓存导出固定要 5 分钟，
          # 等于为了省 2 分钟先花 5 分钟；registry 缓存在 GHCR 上是私有的
          # （匿名拉取 401），fork PR 的 token 也读不到，借读会直接失败。
