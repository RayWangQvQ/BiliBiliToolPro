name: PR checks

on:
  pull_request:
    branches: [main]
    # Never add a paths filter here: a skipped workflow reports no checks, so the
    # required checks stay Pending forever. Gating is job-level (see classify-changes).
  # Backfill entry point for publish-stable-release.yml's changelog job. GITHUB_TOKEN-created PRs
  # do trigger this; they just wait for approval. Dispatched checks are not
  # reported on the PR, so this is only a manual fallback.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一个 PR 的新提交取消旧运行
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip every heavy job below (ADR-0011). Job-level on purpose:
  # a skipped job reports Success, a skipped workflow would leave checks Pending.
  classify-changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      # fetch-depth: 0: the base..head diff needs the base commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # fail-open: only a successfully enumerated diff that is fully whitelisted counts
          pattern='^(.*\.md|docs/.*|\.editorconfig|bruno/.*)$'
          files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" || true)

          docs_only=false
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$pattern"; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          echo "docs_only=$docs_only，变更文件："
          # Wrapped in `if`: an empty $files makes the loop exit non-zero under the
          # default `bash -e`, which would fail this job and silently skip every job below.
          if [ -n "$files" ]; then
            while IFS= read -r f; do echo "  $f"; done <<< "$files"
          fi

  # 构建 + 离线回归测试（含单元、组件、架构和集成测试）
  # [Trait("Category", "External")] 的真实外部调用被过滤，只能显式手动执行。
  build-and-test:
    name: Build and test .NET
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          # 不要开 cache：setup-dotnet 的缓存只认 packages.lock.json，
          # 本仓库启用了集中式版本管理（Directory.Packages.props）且没有 lock 文件，
          # 开了会直接 "Dependencies lock file is not found" 报错。

      - name: Format (csharpier)
        run: |
          dotnet tool restore
          if ! dotnet csharpier check .; then
            echo "::error::代码格式不符合 csharpier，上面列出了具体文件。本地执行下面这条再提交："
            echo "::error::    dotnet tool restore && dotnet csharpier format ."
            exit 1
          fi

      - name: Build
        run: dotnet build Ray.BiliBiliTool.sln --configuration Release --nologo

      - name: Test (offline)
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: >
          dotnet test Ray.BiliBiliTool.sln --configuration Release --no-build
          --filter "Category!=External" --nologo

  # 发布脚本的 fixture 测试：在临时 git 仓库/模拟 PR 标题上验证算号与 notes 生成。
  # 发布逻辑是发布系统的命脉，但它不碰 .NET 代码，所以独立于 build-and-test。
  test-release-scripts:
    name: Test release scripts
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0：最后的 dry-run 要在真实 tag 历史上演算 alpha 版本
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Qinglong SDK detection fixtures
        run: bash ./scripts/test-qinglong-dotnet.sh

      - name: Version derivation fixtures
        run: bash ./scripts/test-version-next.sh

      - name: Release notes fixtures
        run: bash ./scripts/test-release-notes.sh

      - name: Update changelog fixtures
        run: bash ./scripts/test-update-changelog.sh

      # alpha workflow 的版本计算步骤在 PR 上的 dry-run 冒烟（只算不推）
      - name: Alpha version dry-run
        run: |
          planned=$(bash ./scripts/version-next.sh alpha)
          echo "本 PR 合并后将产出 alpha：$planned"

  # 只构建不推送，用来保证合并到 main 之后镜像可以构建
  build-docker-image:
    name: Build Docker image
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: bili-tool-web:smoke
          # 不带缓存：交叉编译后冒烟构建只要 2-3 分钟，而 gha 缓存导出固定要 5 分钟，
          # 等于为了省 2 分钟先花 5 分钟；registry 缓存在 GHCR 上是私有的
          # （匿名拉取 401），fork PR 的 token 也读不到，借读会直接失败。

  # CodeQL analysis (moved out of codeql-analysis.yml, see ADR-0012).
  codeql-scan:
    name: Scan code with CodeQL
    needs: classify-changes
    if: needs.classify-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level on purpose: "security-events: write" must not leak to the other jobs
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      # C# is compiled: CodeQL needs a real build to resolve the call graph
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
