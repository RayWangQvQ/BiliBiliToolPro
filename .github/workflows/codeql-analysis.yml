name: CodeQL

on:
  pull_request:
    branches: [main]
    # Never add a paths filter here: a skipped workflow reports no checks, so the
    # required Analyze check stays Pending forever. Gating is job-level (see below).
  # Manual backfill, same as ci.yml.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Same docs-only gate as ci.yml's Scope (second copy of the whitelist, see ADR-0011).
  # Kept out of the name "Scope" to avoid two identically named checks on a PR.
  CodeQLScope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      # fetch-depth: 0: the base..head diff needs the base commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # fail-open: only a successfully enumerated diff that is fully whitelisted counts
          pattern='^(.*\.md|docs/.*|\.editorconfig|bruno/.*)$'
          files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" || true)

          docs_only=false
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$pattern"; then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          echo "docs_only=$docs_only，变更文件："
          # Wrapped in `if`: an empty $files makes the loop exit non-zero under the
          # default `bash -e`, which would fail this job and silently skip Analyze.
          if [ -n "$files" ]; then
            while IFS= read -r f; do echo "  $f"; done <<< "$files"
          fi

  Analyze:
    name: Analyze
    needs: CodeQLScope
    if: needs.CodeQLScope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      # C# 是编译型语言，CodeQL 需要一次真实构建才能拿到调用图
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
